<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Green Prairie Electrical Summary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=Geist+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#f3f5f6;--card:#ffffff;--ink:#101416;--body:#3b4347;--faint:#6b747a;--rule:#d3d9dd;--petrol:#174e58;--ochre:#e0a21c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#0e1213;--card:#161c1e;--ink:#eef2f3;--body:#c4ccd0;--faint:#8d979c;--rule:#2b3437;--petrol:#2a6f7c}}
:root[data-theme="dark"]{--paper:#0e1213;--card:#161c1e;--ink:#eef2f3;--body:#c4ccd0;--faint:#8d979c;--rule:#2b3437;--petrol:#2a6f7c}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--body);font:400 19px/1.6 "Archivo",system-ui,sans-serif}
.wrap{max-width:880px;margin:0 auto;padding:0 16px 64px}
header{background:var(--petrol);color:#fff;padding:40px 16px 36px}
header .wrap{padding-bottom:0}
h1{font-weight:700;font-stretch:112%;letter-spacing:-.02em;font-size:clamp(30px,6vw,44px);line-height:1.1;margin:0 0 10px;color:#fff}
header p{margin:0;font-size:19px;opacity:.9}
h2{color:var(--ink);font-weight:700;font-stretch:112%;letter-spacing:-.01em;font-size:28px;margin:48px 0 14px}
h3{color:var(--ink);font-size:21px;margin:0 0 6px}
.num{font-family:"Geist Mono",ui-monospace,monospace;font-weight:600;color:var(--ink)}
.metered{border-bottom:3px solid var(--ochre)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-top:22px}
.stat{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:18px}
.stat .num{font-size:30px;display:block;line-height:1.2}
.stat span.l{font-size:16px;color:var(--faint)}
.card{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:22px;margin:14px 0}
.card p{margin:6px 0 0}
.tag{display:inline-block;font-size:14px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--faint);border:1px solid var(--rule);border-radius:999px;padding:2px 10px;margin-bottom:8px}
.chart{width:100%;height:auto;display:block}
.chart .ax{font:13px "Geist Mono",monospace;fill:var(--faint)}
.legend{display:flex;flex-wrap:wrap;gap:18px;font-size:16px;margin-top:8px}
.legend i{display:inline-block;width:22px;height:4px;vertical-align:middle;margin-right:6px;border-radius:2px}
table{width:100%;border-collapse:collapse;font-size:17px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
th{color:var(--ink);font-weight:600}
td.r,th.r{text-align:right}
.scroll{overflow-x:auto}
ol.confirm{padding-left:24px}ol.confirm li{margin:0 0 16px}
ol.confirm b{color:var(--ink)}
a{color:var(--petrol)}
.foot{margin-top:48px;font-size:15px;color:var(--faint);border-top:1px solid var(--rule);padding-top:16px}

.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.gate form{background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:32px;width:100%;max-width:420px}
.gate h1{color:var(--ink);font-size:30px;margin:0 0 8px}
.gate p{margin:0 0 20px}
.gate label{display:block;font-weight:600;color:var(--ink);margin-bottom:8px}
.gate input{width:100%;font:inherit;font-size:20px;padding:14px 16px;border:1px solid var(--rule);border-radius:10px;background:var(--paper);color:var(--ink)}
.gate button{margin-top:16px;width:100%;font:inherit;font-weight:700;font-size:20px;padding:14px;border:0;border-radius:10px;background:var(--petrol);color:#fff;cursor:pointer}
.gate .err{color:#b3261e;margin-top:12px;min-height:1.6em}

/* Green Prairie page */
.gp h2{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--petrol);padding-bottom:6px}
.gp h2 span,.gp h3 span{font-family:"Geist Mono",monospace;font-size:17px;font-weight:600;color:var(--faint)}
.gp h3{display:flex;justify-content:space-between;gap:12px;margin-top:30px}
.gp .lede{font-size:19px}
.gp .sub{margin:0 0 8px;font-size:16px;color:var(--faint)}
.gp .stats .stat b{display:block;font-family:"Geist Mono",monospace;font-size:28px;color:var(--ink);line-height:1.2}
.gp .stats .stat span{font-size:16px;color:var(--faint)}
.gp .callout{background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--ochre);border-radius:12px;padding:18px 20px;margin:14px 0}
.gp .callout b.t{display:block;color:var(--ink);font-size:20px;margin-bottom:4px}
.gp table{font-size:16px;background:var(--card)}
.gp th{background:var(--petrol);color:#fff;font-weight:600}
.gp td.n,.gp th.n{text-align:right;white-space:nowrap;font-family:"Geist Mono",monospace}
.gp td.m{font-family:"Geist Mono",monospace;font-size:14px}
.gp td.small{font-size:14px;color:var(--faint)}
.gp tr.hl td{background:rgba(224,162,28,.18);font-weight:700;color:var(--ink)}
.gp .b{display:inline-block;padding:2px 9px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap;border:1px solid var(--rule)}
.gp .vfd{background:rgba(23,78,88,.12);color:var(--petrol)} .gp .ss{background:rgba(224,162,28,.18);color:#7a5414}
.gp .dol{color:var(--faint)} .gp .pkg{background:rgba(60,90,160,.12);color:#2f4a7a} .gp .oth{color:var(--faint)}
.gp ul{padding-left:22px} .gp li{margin-bottom:10px}
.gp .tree{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.gp .node{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:10px 14px;margin-bottom:8px}
.gp .node small{display:block;color:var(--faint);font-size:15px}
.gp .node.src{background:var(--petrol);color:#fff;border:0} .gp .node.src small{color:#cfe3e8}
.gp .node.gen{border-left:4px solid var(--ochre)}
.gp .node.sub{margin-left:18px} .gp .node.sub2{margin-left:36px}
.gp .cap{font-family:"Geist Mono",monospace;font-size:15px;color:var(--faint);margin-top:4px}
.gp .accrow{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--rule)}
.gp .lvl{flex:0 0 92px;text-align:center;font-weight:700;font-size:14px;padding:4px 0;border-radius:6px;height:fit-content}
.gp .lvl.hi{background:rgba(29,107,60,.14);color:#1d6b3c} .gp .lvl.md{background:rgba(224,162,28,.2);color:#7a5414} .gp .lvl.lo{background:var(--rule);color:var(--body)}
.gp .dl .btn{display:inline-block;margin-top:12px;background:var(--petrol);color:#fff;text-decoration:none;font-weight:700;padding:12px 18px;border-radius:10px}
.gp .foot{border-top:1px solid var(--rule)}
</style>
</head>
<body>
<div class="gate" id="gate"><form id="f">
<h1>Green Prairie Electrical Summary</h1>
<p>Enter the password to view this page.</p>
<label for="pw">Password</label>
<input id="pw" type="password" autocomplete="current-password" autofocus>
<button type="submit">View</button>
<div class="err" id="err" role="alert"></div>
</form></div>
<div id="content"></div>

async function open_(pw){
 const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw.trim().toLowerCase()),"PBKDF2",false,["deriveKey"]);
 const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:D.n,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
 const p=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.i)},k,u(D.c));
 document.getElementById("gate").remove();
 document.getElementById("content").innerHTML=new TextDecoder().decode(p);
}
document.getElementById("f").addEventListener("submit",async e=>{
 e.preventDefault();
 const pw=document.getElementById("pw").value;
 try{await open_(pw);try{sessionStorage.setItem("gpi",pw)}catch(_){}}
 catch(_){document.getElementById("err").textContent="That password didn't work. Try again.";}
});
try{const s=sessionStorage.getItem("gpi");if(s)open_(s).catch(()=>{})}catch(_){}
</script>
